---
configuration:
  load_driver:
    name: Load the NVIDIA driver
    description: >-
      Off: only build the driver for the running kernel and report the result.
      On: load it into the HAOS kernel and enable the GPU. A crash in the driver
      takes the whole system down, so switch this on while someone is home.
  build_jobs:
    name: Build jobs
    description: >-
      Parallel compile jobs for the one-time driver build after each HAOS update.
      Lower keeps Home Assistant more responsive during the build.
  retry_after_crash:
    name: Retry after a crash
    description: >-
      If a load attempt never finished before a reboot, the add-on refuses to load
      again. Switch this on to allow one more attempt, then switch it back off.
  hot_c:
    name: Hot threshold (°C)
    description: >-
      At this GPU temperature, or on a hardware thermal slowdown, the GPU is reported
      "hot": Whisper moves to the CPU and the LLM stops answering until it cools.
  cool_c:
    name: Cool threshold (°C)
    description: The GPU is reported "ok" again at or below this temperature.
  module_params:
    name: Module parameters
    description: >-
      Extra nvidia.ko parameters, space-separated, e.g.
      NVreg_RegistryDwords=PowerMizerEnable=0x1;PerfLevelSrc=0x2222. Empty by default.
      They apply when this add-on loads the driver, i.e. after the next host reboot.
  auto_recover:
    name: Reset the host when the GPU is lost
    description: >-
      When the GPU falls off the bus (Xid 79) and stays gone for 2 minutes, flush the disks and
      do a full platform reset, which power-cycles the GPU. A normal reboot hangs in that state.
      At most twice per 24 hours. Off by default.
  core_offset_mhz:
    name: Core clock offset (MHz)
    description: >-
      Negative offset on the GPU core clock (0 = none). Lowers the top boost clock and its voltage,
      so load spikes are smaller. Idle clocks are not affected. Applied at every add-on start.
  mem_offset_mhz:
    name: Memory clock offset (MHz)
    description: Negative offset on the memory clock (0 = none). Applied at every add-on start.
  console_unbind:
    name: Detach the text console from the GPU
    description: >-
      The boot console (efifb) draws into the GPU's memory window. On: detach it, so nothing but
      the NVIDIA driver writes there (the laptop screen stops showing console text). Off: reattach.
  pcie_watch:
    name: Watch PCIe link errors
    description: >-
      Every 0.5 s, read and clear the latched link error bits of the GPU and its PCIe port. Each
      error is logged with its time and link speed, counted on the sensor and written to
      /share/nvidia/pcie-events.log.
  pcie_max_gen:
    name: PCIe speed cap (generation)
    description: >-
      Highest PCIe generation the GPU's link may use: 1 = 2.5 GT/s, 2 = 5 GT/s, 3 = 8 GT/s. 0 = no
      cap (and undoes a cap set earlier in this boot). Holds from the next link speed change.
