---
name: NVIDIA Driver
version: 0.2.1
slug: nvidia-driver
description: >-
  Builds, loads and monitors the NVIDIA driver on HAOS (Pascal / driver 580) and publishes the
  GPU state that GPU add-ons read. The only add-on that touches the kernel.
url: https://github.com/windyo/addons/tree/master/nvidia-driver
arch:
  - amd64
# No `image:` on purpose: the Supervisor builds this add-on locally from the Dockerfile.
# System stage: before the services stage (Whisper) and the application stage (Ollama). The
# Supervisor waits up to 120 s for "healthy", which a cached load reaches in seconds.
startup: system
# Never start on boot until a reboot test has passed on this machine.
boot: manual
# Device rule "a *:* rwm": mknod needs the cgroup "m" right on the nvidia majors.
full_access: true
# CAP_SYS_MODULE + host /lib/modules (read-only) for the vermagic reference and deps.
kernel_modules: true
privileged:
  - SYS_MODULE
  - MKNOD
  # mount the kernel's devtmpfs to create /dev/nvidia* (the add-on's /dev is read-only), and a
  # private /proc for SysRq (host reset)
  - SYS_ADMIN
  # /dev/port: CF9h full platform reset when the GPU has wedged the host (nv-host-reset.sh)
  - SYS_RAWIO
apparmor: false
# "host-reset" and "pcie" via hassio.addon_stdin
stdin: true
# /share/nvidia/state.json: the contract GPU consumers read.
map:
  - share:rw
# Publishes sensor.nvidia_gpu_status.
homeassistant_api: true
# Reads the installed HAOS version (/os/info) to fetch that release's kernel patches.
hassio_api: true
options:
  driver_branch: "580"
  load_driver: true
  build_jobs: 4
  retry_after_crash: false
  hot_c: 85
  cool_c: 78
  module_params: ""
  auto_recover: false
  core_offset_mhz: 0
  mem_offset_mhz: 0
  console_unbind: false
  pcie_watch: true
  pcie_max_gen: 0
  acpi_watch: true
schema:
  driver_branch: list(580|570)
  load_driver: bool
  build_jobs: int(1,8)
  retry_after_crash: bool
  hot_c: int(70,95)
  cool_c: int(60,90)
  auto_recover: bool
  core_offset_mhz: int(-500,0)
  mem_offset_mhz: int(-1000,0)
  console_unbind: bool
  pcie_watch: bool
  acpi_watch: bool
  pcie_max_gen: int(0,3)
  module_params: match(^(NVreg_[A-Za-z0-9]+=[A-Za-z0-9_.;=]+( |$))*$)
