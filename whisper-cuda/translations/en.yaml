---
configuration:
  load_driver:
    name: Load the NVIDIA driver
    description: >-
      Off: only build the driver for the running kernel and report the result.
      On: load it into the HAOS kernel and enable the GPU. A crash in the driver
      takes the whole system down, so switch this on while someone is home.
  build_jobs:
    name: Build jobs
    description: >-
      Parallel compile jobs for the one-time driver build after each HAOS update.
      Lower keeps Home Assistant more responsive during the build.
  retry_after_crash:
    name: Retry after a crash
    description: >-
      If a load attempt never finished before a reboot, the add-on refuses to load
      again. Switch this on to allow one more attempt, then switch it back off.
  model:
    name: Whisper model (GPU)
    description: >-
      faster-whisper model used on the GPU, e.g. large-v3-turbo, large-v3, medium, small,
      or a Hugging Face CTranslate2 repo id. Downloaded once into the add-on data.
  compute_type:
    name: Compute type (GPU)
    description: >-
      int8_float32 or float32 on Pascal cards (GTX 10xx). float16 runs at a fraction of
      the speed on Pascal and is only useful on Turing (RTX 20xx) and newer.
  beam_size:
    name: Beam size
    description: Candidates kept while decoding. 1 is fastest, 5 is Whisper's usual accuracy setting.
  ha_name_biasing:
    name: Bias toward Home Assistant names
    description: >-
      Prompt Whisper with the names of entities, areas and floors exposed to Assist so
      they are recognised more reliably.
  cpu_fallback_model:
    name: CPU fallback model
    description: Model used (int8, on the CPU) when the GPU is unavailable.
  benchmark:
    name: Run the benchmark at start
    description: >-
      Benchmark model and setting combinations on this machine before serving, then
      publish the results as sensor.whisper_cuda_benchmark. Takes 20-40 minutes and
      downloads several models the first time. Switch back off afterwards.
  benchmark_configs:
    name: Benchmark configurations
    description: >-
      Comma-separated names from the catalogue in bench.py, e.g.
      "turbo int8 b1,turbo int8 b5,turbo int8 b1 +names".
  benchmark_piper_gpu:
    name: Benchmark Piper on the GPU
    description: Also time Piper text-to-speech on the GPU vs the CPU (first run downloads ~1.3 GB).
  debug:
    name: Debug logging
    description: Verbose logs from the Whisper server.
