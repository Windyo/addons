---
name: Whisper CUDA
version: 0.3.0
slug: whisper-cuda
description: >-
  Whisper speech-to-text on an NVIDIA GPU under HAOS (Pascal / driver 580),
  with automatic CPU fallback.
url: https://github.com/windyo/addons/tree/master/whisper-cuda
arch:
  - amd64
image: ghcr.io/windyo/whisper-cuda-{arch}
startup: services
boot: manual
# Device rule "a *:* rwm" (honoured only with Protection mode off): opens the /dev/nvidia* nodes
# the NVIDIA Driver add-on creates. No kernel rights, default AppArmor profile (proven by
# gpu-probe, 2026-11-20).
full_access: true
# /share/nvidia/state.json from the NVIDIA Driver add-on.
map:
  - share:ro
# Publishes sensor.whisper_cuda_status; reads exposed names for biasing.
homeassistant_api: true
discovery:
  - wyoming
ports:
  "10300/tcp": null
options:
  model: large-v3-turbo
  compute_type: int8_float32
  beam_size: 1
  ha_name_biasing: true
  vad_filter: true
  cpu_fallback_model: small
  benchmark: false
  benchmark_configs: fr-large-v3 int8 b5 +names +vad,fr-distil int8 b5 +names +vad
  debug: false
schema:
  model: str
  compute_type: list(int8_float32|float32|int8|float16|int8_float16)
  beam_size: int(1,10)
  ha_name_biasing: bool
  vad_filter: bool
  cpu_fallback_model: str
  benchmark: bool
  benchmark_configs: str
  debug: bool
