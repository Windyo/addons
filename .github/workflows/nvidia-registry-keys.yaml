name: nvidia-registry-keys

# Read-only survey for the GTX 1070 fault work: which power/clock/perf registry keys does each
# NVIDIA driver branch's closed resource manager (nv-kernel.o_binary) still contain? Decides whether
# a performance pin or clock offset exists on 580 (module_params) or needs an older branch.
# Output: job summary + artifact (per-version key lists and a cross-version table).
on:
  push:
    paths:
      - ".github/workflows/nvidia-registry-keys.yaml"
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Last or late release of each branch that supports Pascal. A missing version is skipped.
      # 470-570 were surveyed in run 45365745525; GitHub's 10-annotation cap dropped both 580 rows
      # there, so this run lists the driver in use only, in chunks (one category per step).
      VERSIONS: "580.196.07"
    steps:
      - name: Extract and list keys
        shell: bash
        run: |
          set -u
          mkdir -p out
          for v in $VERSIONS; do
            ok=""
            for f in "NVIDIA-Linux-x86_64-$v.run" "NVIDIA-Linux-x86_64-$v-no-compat32.run"; do
              code=$(curl -sSL -o nv.run -w '%{http_code}' "https://download.nvidia.com/XFree86/Linux-x86_64/$v/$f" || echo curl-failed)
              echo "$v $f: HTTP $code, $(stat -c %s nv.run 2>/dev/null || echo 0) bytes"
              [ "$code" = 200 ] && { ok=1; break; }
            done
            [ -n "$ok" ] || { echo "::warning title=$v::not downloadable (HTTP $code)"; echo "$v: not downloadable" >> out/skipped.txt; continue; }
            rm -rf x
            if ! sh nv.run --extract-only --target x > extract.log 2>&1; then
              echo "::warning title=$v::extract failed: $(tail -n 3 extract.log | tr '\n' ' ')"
              echo "$v: extract failed" >> out/skipped.txt; continue
            fi
            blob=$(find x -name 'nv-kernel.o_binary' | head -1)
            if [ -z "$blob" ]; then
              echo "::warning title=$v::no nv-kernel.o_binary; kernel dir: $(ls x/kernel 2>&1 | tr '\n' ' ')"
              echo "$v: no nv-kernel.o_binary" >> out/skipped.txt; continue
            fi
            echo "$v: blob $blob ($(stat -c %s "$blob") bytes)"
            # Identifier-like strings only; registry keys are plain ASCII names.
            strings -n 6 "$blob" | grep -E '^[A-Za-z][A-Za-z0-9_]{5,63}$' | sort -u > "out/$v.all.txt" || true
            grep -iE 'powermizer|perflevel|perf_?level|pstate|perfcap|maxperf|minperf|boost|overclock|clkoffset|clock.?offset|vfoffset|undervolt|voltage|gpcclk|mclk|memclk|elpg|gpcpg|lpwr|powergat|adaptive|thermal|slowdown|pwrcap|powerlimit|powercap|perf' \
              "out/$v.all.txt" > "out/$v.power.txt" || true
            echo "::notice title=$v::$(wc -l < "out/$v.all.txt") identifiers, $(wc -l < "out/$v.power.txt") power/clock/perf; PowerMizer/PerfLevel keys: $(grep -iE 'powermizer|perflevel|maxperf' "out/$v.all.txt" | tr '\n' ' ')"
            # Idle power features (graphics-engine power gating, memory-system clock gating, VRM
            # phase shedding, clock gating, GC6): one annotation per version, keys only.
            lp=$(grep -iE 'elpg|mscg|lpwr|psi|gc6|gc5|gpcpg|grpg|powergat|pwrgat|clkgat|clockgat|blcg|slcg|flcg|lowpower|deepidle|idle|ppg|sramgat|railgat|vrm' "out/$v.all.txt" | tr '\n' ' ')
            echo "::notice title=$v idle-power keys::$lp"
            rm -rf x nv.run
          done
          ls -la out

      - name: "580: power/clock/perf keys"
        shell: bash
        run: |
          f=out/580.196.07.power.txt; [ -s "$f" ] || { echo "::warning::no $f"; exit 0; }
          tr '\n' ' ' < "$f" | fold -s -w 1800 | nl -w1 -s' ' | while read -r n rest; do
            echo "::notice title=580 power/clock/perf $n::$rest"; done

      - name: "580: gating, idle, clock, voltage keys"
        shell: bash
        run: |
          f=out/580.196.07.all.txt; [ -s "$f" ] || { echo "::warning::no $f"; exit 0; }
          grep -iE 'elpg|mscg|lpwr|psi|gc6|gc5|gpcpg|grpg|powergat|pwrgat|clkgat|clockgat|blcg|slcg|flcg|elcg|lowpower|deepidle|idle|ppg|sramgat|railgat|vrm' "$f" \
            | grep -viE 'perf' | tr '\n' ' ' | fold -s -w 1800 | nl -w1 -s' ' | while read -r n rest; do
            echo "::notice title=580 gating/idle $n::$rest"; done
          grep -iE 'clk|clock|freq|volt|vdd|droop|nafll|adc|vfe|vfield|pstate|pcie.*(gen|speed)|linkspeed|gen[0-9]' "$f" \
            | grep -viE 'perf|elpg|lpwr' | tr '\n' ' ' | fold -s -w 1800 | nl -w1 -s' ' | while read -r n rest; do
            echo "::notice title=580 clock/volt/pcie $n::$rest"; done

      - name: Cross-version table
        shell: bash
        run: |
          set -u
          cd out
          vs=$(find . -maxdepth 1 -name '*.power.txt' -printf '%f\n' | sed 's/\.power\.txt$//' | sort -V)
          {
            echo "## Power/clock/perf identifiers in nv-kernel.o_binary"
            echo
            if [ -z "$vs" ]; then
              echo "No driver could be read."
            else
              cat ./*.power.txt | sort -u > union.txt
              printf '| key |'; for v in $vs; do printf ' %s |' "$v"; done; echo
              printf '|---|'; for v in $vs; do printf -- '---|'; done; echo
              while read -r k; do
                printf '| `%s` |' "$k"
                for v in $vs; do if grep -qxF "$k" "$v.power.txt"; then printf ' x |'; else printf '  |'; fi; done
                echo
              done < union.txt
              echo
              echo "### Must-know keys"
              for k in PowerMizerEnable PowerMizerLevel PowerMizerDefault PowerMizerDefaultAC PerfLevelSrc OverrideMaxPerf RMPerfLimits RMDisableGpuBoost; do
                printf -- '- `%s`:' "$k"; for v in $vs; do if grep -qxF "$k" "$v.all.txt"; then printf ' %s' "$v"; fi; done; echo
              done
            fi
            if [ -s skipped.txt ]; then echo; echo "### Skipped"; sed 's/^/- /' skipped.txt; fi
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-registry-keys
          path: out/
