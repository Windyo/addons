name: whisper-cuda

on:
  push:
    paths:
      - "whisper-cuda/**"
      - ".github/workflows/whisper-cuda.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: whisper-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read add-on version
        id: meta
        run: |
          echo "version=$(yq -r .version whisper-cuda/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whisper-cuda-amd64" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: whisper-cuda
          load: true
          tags: whisper-cuda:test
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}

      - name: Shell syntax and Python environment
        run: |
          docker run --rm whisper-cuda:test bash -c '
            set -e
            for f in /usr/local/bin/*.sh; do bash -n "$f"; done
            /opt/venv/bin/python -m py_compile /usr/local/bin/bench.py
            /opt/venv/bin/python -c "import ctranslate2, faster_whisper, wyoming_faster_whisper, piper, aiohttp; print(ctranslate2.__version__)"
            /opt/venv/bin/python -m wyoming_faster_whisper --version
            ldconfig -p | grep -E "libcuda.so.1|libnvidia-ml.so.1|libcublas.so.12|libcublasLt.so.12"
            test ! -e /opt/nvidia/kernel-src && test ! -e /usr/bin/nvidia-modprobe
            if find / -xdev -name "libcudnn*" | grep .; then echo "cuDNN must never ship"; exit 1; fi
            nvidia-smi --version | head -1 || true'

      # End-to-end on CPU: Piper test speech -> faster-whisper -> scoring. Gates the push, since a
      # broken Whisper server would take speech-to-text down on the device.
      - name: CPU benchmark smoke test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run --rm -v "$RUNNER_TEMP/data:/data" whisper-cuda:test \
            /usr/local/bin/bench.py "CPU base int8 b5" "CPU base int8 b5 +vad" 2>&1 | tee "$RUNNER_TEMP/bench.log"
          r="$RUNNER_TEMP/data/bench/results.json"
          jq -e '.results[0] | (.error | not) and .en_clean.wer_pct < 40 and .fr_clean.wer_pct < 60' "$r"
          # VAD filter: no speech -> no output, and it must not cost accuracy on real speech.
          jq -e '.results[1] | (.error | not) and .silence_halluc_words == 0 and .en_clean.wer_pct < 40' "$r"
          echo "::notice title=CPU smoke +vad::$(jq -c '.results[1] | {latency_mean_s, fr_clean, en_clean, fr_noisy, en_noisy, silence_halluc_words, fallbacks_total}' "$r")"
          echo "::notice title=CPU smoke benchmark::$(jq -c '.results[0] | {latency_mean_s, fr_clean, en_clean, fr_noisy, en_noisy, silence_halluc_words}' "$r")"
          echo "::notice title=Piper CPU synthesis::$(jq -c .piper_cpu "$r")"

      # No driver on the runner: 0.3 must serve from the CPU at once, never wait for the GPU.
      - name: Starts on the CPU without a driver
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/addon-data" "$RUNNER_TEMP/share"
          yq -o=json '.options + {"cpu_fallback_model": "base"}' whisper-cuda/config.yaml > "$RUNNER_TEMP/addon-data/options.json"
          docker run -d --name stt -v "$RUNNER_TEMP/addon-data:/data" -v "$RUNNER_TEMP/share:/share:ro" whisper-cuda:test
          for i in $(seq 1 60); do docker exec stt nc -z 127.0.0.1 10300 && break; sleep 5; done
          docker logs stt 2>&1 | tail -n 20
          docker exec stt nc -z 127.0.0.1 10300
          docker logs stt 2>&1 | grep -q "speech-to-text on CPU (gpu_unavailable: driver not loaded)"
          test "$(docker exec stt cat /tmp/stt.mode)" = cpu
          docker rm -f stt

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag whisper-cuda:test "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"

      # Logs need a GitHub login; annotations are public, so surface the key facts there.
      - name: Report failure details
        if: failure()
        run: |
          f="$RUNNER_TEMP/bench.log"
          [ -s "$f" ] || exit 0
          body=$(tail -n 60 "$f" | head -c 30000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=bench-tail::$body"
