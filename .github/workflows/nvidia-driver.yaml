name: nvidia-driver

# Check only: the Supervisor builds this add-on on the device, so nothing is pushed to GHCR.
on:
  push:
    paths:
      - "nvidia-driver/**"
      - ".github/workflows/nvidia-driver.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image (same Dockerfile the Supervisor builds)
        run: |
          docker build --build-arg BUILD_VERSION="$(yq -r .version nvidia-driver/config.yaml)" -t nvidia-driver:test nvidia-driver
          echo "::notice title=Image size::$(docker image inspect -f '{{.Size}}' nvidia-driver:test | numfmt --to=iec)"

      - name: Shell syntax and image contents
        run: |
          docker run --rm nvidia-driver:test bash -c '
            set -e
            for f in /usr/local/bin/*.sh; do bash -n "$f"; done
            test "$(cat /opt/nvidia/VERSION)" = 580.196.07
            python3 /usr/local/bin/nv-acpi-watch.py selftest
            ldconfig -p | grep libnvidia-ml.so.1
            test -d /opt/nvidia/kernel-src
            # driver_branch: both branches in the image, the links follow nv-branch.sh
            test "$(nv-branch.sh 570)" = 570.211.01
            test "$(cat /opt/nvidia/VERSION)" = 570.211.01
            readlink -f /opt/nvidia/lib/libnvidia-ml.so.1 | grep -q "libnvidia-ml.so.570.211.01$"
            readlink -f /usr/local/bin/nvidia-smi | grep -q "/branches/570.211.01/bin/nvidia-smi$"
            test -f /opt/nvidia/kernel-src/Kbuild
            ldconfig -p | grep -q "libnvidia-ml.so.1 .*=> /opt/nvidia/lib/libnvidia-ml.so.1"
            test "$(nv-branch.sh 580)" = 580.196.07
            readlink -f /opt/nvidia/lib/libnvidia-ml.so.1 | grep -q "libnvidia-ml.so.580.196.07$"
            if nv-branch.sh 999 2>/dev/null; then echo "unknown branch must fail"; exit 1; fi
            test "$(cat /opt/nvidia/VERSION)" = 580.196.07
            if find / -xdev -name "libcudnn*" | grep .; then echo "cuDNN must never ship"; exit 1; fi'

      # No GPU on the runner: the add-on must still reach its monitor loop, write the consumer
      # contract and report itself healthy.
      - name: Runs without a GPU (state.json contract, heartbeat)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/share"
          yq -o=json .options nvidia-driver/config.yaml > "$RUNNER_TEMP/data/options.json"
          docker run -d --name drv -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/share:/share" nvidia-driver:test
          sleep 20
          docker logs drv
          docker exec drv test -n "$(docker exec drv find /tmp/heartbeat -mmin -1)"
          docker rm -f drv
          cat "$RUNNER_TEMP/share/nvidia/state.json"
          jq -e '.state == "no_gpu" and (.boot_id | length) == 36 and .thermal == "ok" and .driver == "580.196.07"
                 and (.updated | fromdateiso8601) > (now - 60)' "$RUNNER_TEMP/share/nvidia/state.json"
          # driver_branch 570 with no driver loaded: the add-on runs on 570's userspace.
          jq '.driver_branch = "570"' "$RUNNER_TEMP/data/options.json" > o.json && mv o.json "$RUNNER_TEMP/data/options.json"
          docker run -d --name drv -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/share:/share" nvidia-driver:test
          sleep 20
          docker logs drv | tee drv570.log
          docker rm -f drv
          grep -q "driver 570.211.01 (driver_branch: 570.211.01)" drv570.log
          jq -e '.state == "no_gpu" and .driver == "570.211.01"' "$RUNNER_TEMP/share/nvidia/state.json"

      # The ACPI watcher's kprobes on the runner's own kernel. No NVIDIA module there, so only the
      # system-wide notify probe can attach. Twice: kprobe definitions outlive the container, so the
      # second run proves the first one's leftovers are cleaned up.
      - name: ACPI watcher attaches (runner kernel)
        shell: bash
        run: |
          for i in 1 2; do
            docker run --rm --privileged --entrypoint bash nvidia-driver:test -c '
              mkdir -p /run/t && mount -t tracefs nodev /run/t
              timeout 5 python3 /usr/local/bin/nv-acpi-watch.py /run/t /tmp/s.json /tmp/e.log
              echo "--- kprobe_events:"; cat /run/t/kprobe_events
              echo "--- error_log:"; tail -n 8 /run/t/error_log
              echo "--- summary:"; cat /tmp/s.json' > "acpi$i.log" 2>&1 || true
            cat "acpi$i.log"; echo   # the summary has no final newline; the annotation must start a line
            # The step log needs a GitHub login: put the output in an annotation.
            echo "::notice title=acpi watcher run $i::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "acpi$i.log" | head -c 4000)"
            tail -n 1 "acpi$i.log" | jq -e '.probes.notify == "ok" and (.probes | length) == 3'
          done

      # The same script the add-on runs on the device, against the config read out of the
      # official HAOS 18.3 kernel (IKCONFIG). Proves the driver builds for that exact kernel.
      - name: Compile driver for HAOS 18.3 (6.18.52-haos)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm \
            -v "$PWD/nvidia-driver/tests:/tests:ro" -v "$RUNNER_TEMP/out:/out" \
            nvidia-driver:test \
            nv-build-modules.sh 6.18.52-haos /tests/haos-18.3-kernel.config /out/6.18.52-haos "$(nproc)" /usr/local/share/nvidia-driver/linux-patches \
            2>&1 | tee "$RUNNER_TEMP/out/build.log"

      - name: Check result
        run: |
          d="$RUNNER_TEMP/out/6.18.52-haos"
          ls -la "$d"
          echo "vermagic: '$(cat "$d/vermagic")'"
          echo "config drift:"; cat "$d/config-drift.txt"
          test "$(cat "$d/vermagic")" = "6.18.52-haos SMP preempt mod_unload "
          docker run --rm -v "$d:/m:ro" nvidia-driver:test modinfo /m/nvidia.ko /m/nvidia-uvm.ko

      # driver_branch 570 (the 580-regression test) for the kernel HAOS runs now, through the same
      # NV_ROOT path the add-on uses for a branch that isn't loaded.
      - name: Compile driver 570 for 6.18.58-haos
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out570"
          docker run --rm -e NV_ROOT=/opt/nvidia/branches/570.211.01 \
            -v "$PWD/nvidia-driver/tests:/tests:ro" -v "$RUNNER_TEMP/out570:/out" \
            nvidia-driver:test \
            nv-build-modules.sh 6.18.58-haos /tests/haos-6.18.58-kernel.config /out/m "$(nproc)" /usr/local/share/nvidia-driver/linux-patches \
            2>&1 | tee "$RUNNER_TEMP/out/build.log"
          test "$(cat "$RUNNER_TEMP/out570/m/vermagic")" = "6.18.58-haos SMP preempt mod_unload "
          test "$(cat "$RUNNER_TEMP/out570/m/driver_version")" = 570.211.01
          docker run --rm -v "$RUNNER_TEMP/out570/m:/m:ro" nvidia-driver:test modinfo /m/nvidia.ko | grep -E "^(version|vermagic):"

      - name: Report failure details
        if: failure()
        run: |
          f="$RUNNER_TEMP/out/build.log"
          [ -s "$f" ] || exit 0
          body=$(tail -n 80 "$f" | head -c 30000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=build-tail::$body"
